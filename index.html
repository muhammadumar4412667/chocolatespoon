<!DOCTYPE html>
<html>
<head>
    <title>My Website</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            text-align: center;
        }

        header {
            padding: 40px;
            background: #e63946;
        }

        h1 {
            font-size: 45px;
        }

        .box {
            padding: 30px;
            margin: 30px;
            background: #222;
            border-radius: 15px;
        }

        button {
            padding: 15px 30px;
            background: #e63946;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
        }

        button:hover {
            background: #ff5a5f;
        }
    </style>
</head>

<body>

<header>
    <h1>Welcome To My Website</h1>
    <p>My first website using HTML</p>
</header>

<div class="box">
    <h2>About Me</h2>
    <p>
        This is my first website. I am learning web development.
    </p>

    <button>
        Learn More
    </button>
</div>

<div class="box">
    <h2>My Content</h2>
    <p>
        I will add my videos, projects and information here.
    </p>
</div>

</body>
</html>
